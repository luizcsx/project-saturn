<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>

<script>
// Auth guard — non-blocking
fetch('/api/me', { credentials: 'include' })
  .then(function(r) { return r.json(); })
  .then(function(u) {
    if (!u || !u.id) { window.location.replace('/login'); return; }
    var m = document.querySelector('meta[name="user-data"]');
    if (m) {
      m.dataset.authenticated = 'true';
      m.dataset.id = u.id;
      m.dataset.username = u.username;
      m.dataset.duts = u.duts || 0;
      m.dataset.cores = u.cores || 0;
      m.dataset.membership = u.membership || 0;
    }
  })
  .catch(function() { window.location.replace('/login'); });
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00A9FE">

<style>
/* ── Dashboard extra styles ── */
.dashboard-avatar-wrap {
  text-align: center;
  padding-bottom: 10px;
}
.dashboard-avatar-wrap img.avatar-img {
  width: 185px;
  height: 185px;
  display: block;
  margin: 0 auto 8px;
  object-fit: cover;
}
.dashboard-username {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  text-align: center;
}
.dashboard-bucks {
  font-size: 13px;
  color: #aaa;
  text-align: center;
  margin-top: 2px;
}
.friends-header {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #888;
  padding: 8px 0 6px;
  border-top: 1px solid #2e2e34;
  margin-top: 8px;
}
.friends-header span { color: #fff; font-size: 14px; margin-right: 4px; }
.friend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid #1e1e22;
  text-decoration: none;
}
.friend-row:last-child { border-bottom: none; }
.friend-row img {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #2a2a2e;
  flex-shrink: 0;
}
.friend-row .friend-name {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  flex: 1;
}
.friend-row .online-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #23d160;
  flex-shrink: 0;
}
.friend-row .msg-link {
  font-size: 11px;
  font-weight: 700;
  color: #00A9FE;
  letter-spacing: .5px;
}
/* Blog grid */
.blog-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.blog-tile {
  flex: 1;
  position: relative;
  border-radius: 5px;
  overflow: hidden;
  min-height: 115px;
  background: #1a1a22;
  display: block;
  text-decoration: none;
}
.blog-tile .blog-bg {
  width: 100%; height: 115px;
  object-fit: cover;
  display: block;
  background: linear-gradient(135deg,#1a1a2e,#0f3460);
}
.blog-tile .blog-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent,rgba(0,0,0,.8));
  padding: 20px 8px 7px;
  color: #fff;
}
.blog-tile .blog-title {
  font-size: 12px; font-weight: 700;
  margin: 0 0 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.blog-tile .blog-meta { font-size: 10px; opacity: .7; }
/* Status box — reuses new-theme styles */
.status-row {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border: 1px solid #3a3a44;
  border-radius: 5px;
  overflow: hidden;
}
.status-row textarea {
  flex: 1;
  background: #1a1a20;
  border: none;
  outline: none;
  color: #ccc;
  font-size: 14px;
  padding: 12px 14px;
  resize: none;
  font-family: inherit;
  min-height: 68px;
}
.status-row textarea::placeholder { color: #555; }
.status-row .post-btn {
  width: 90px;
  background: #00A9FE;
  color: #fff;
  border: none;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  flex-shrink: 0;
}
.status-row .post-btn:hover { background: #0090d8; }
/* Feed */
.feed-item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #1e1e22;
}
.feed-item-row:last-child { border-bottom: none; }
.feed-item-row img {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: #2a2a2e;
  flex-shrink: 0;
}
.feed-item-row .feed-name { font-weight: 700; color: #fff; font-size: 14px; }
.feed-item-row .feed-time { font-size: 12px; color: #666; margin-left: 5px; }
.feed-item-row .feed-msg  { color: #bbb; font-size: 13px; margin-top: 2px; }
.feed-empty-msg { color: #666; font-size: 13px; padding: 10px 0; }
/* Site banner */
#dash-banner {
  display: none;
  width: 100%;
  padding: 10px 16px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  border-radius: 4px;
  margin-bottom: 12px;
  box-sizing: border-box;
}
#dash-banner.warning { background: #ef9526; }
#dash-banner.success { background: #23d160; }
#dash-banner.error   { background: #ef263d; }
#dash-banner.info    { background: #7b52ab; }
</style>

<body>

<div class="username login-buttons">
<a href="/login" class="login-button">Login</a>
<a href="/register" class="register-button">Register</a>
</div>
</div>
</div>
</div>
<!-- Secondary nav (logged in) -->
<div class="secondary" id="secondary-nav" style="display:none;">
<div class="grid">
<ul>
<li><a href="/dashboard">Home</a></li>
<li><a href="/settings">Settings</a></li>
<li><a href="/avatar">Avatar</a></li>

<li><a href="/trades">Trades</a></li>

</ul>
</div>
</div>

<div class="main-holder grid">
<notification id="notification-v" class="notification"></notification>

<div class="col-10-12 push-1-12" style="margin-top:14px;">

  <!-- Site banner -->
  <div id="dash-banner"></div>

  <div style="display:flex; gap:20px;">

    <!-- LEFT: avatar + friends -->
    <div style="width:200px; flex-shrink:0;">
      <div class="dashboard-avatar-wrap">
        <img class="avatar-img" id="dash-avatar" src="" alt="Avatar"
          onerror="this.src='/cdn/images/default-avatar.png'">
        <div class="dashboard-username" id="dash-username">...</div>
        <div class="dashboard-bucks" id="dash-bucks">0</div>
      </div>
      <div class="friends-header">
        <span id="dash-friend-count">0</span> FRIENDS
      </div>
      <div id="dash-friends-list">
        <div class="feed-empty-msg">No friends yet.</div>
      </div>
    </div>

    <!-- RIGHT: blog + status + feed -->
    <div style="flex:1; min-width:0;">

      <!-- Blog posts -->
      <div class="blog-row" id="dash-blog">
        <div class="blog-tile"><div class="blog-bg"></div></div>
        <div class="blog-tile"><div class="blog-bg"></div></div>
        <div class="blog-tile"><div class="blog-bg"></div></div>
      </div>

      <!-- What's New -->
      <p style="font-size:16px;font-weight:700;color:#fff;margin:0 0 8px;">What's New?</p>
      <div class="status-row">
        <textarea id="status-input" placeholder="Right now I'm..." maxlength="200"></textarea>
        <button class="post-btn" id="status-btn">POST</button>
      </div>

      <!-- Your Feed -->
      <p style="font-size:16px;font-weight:700;color:#fff;margin:0 0 8px;">
        Your Feed
        <span id="req-badge" style="display:none;background:#ef263d;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:6px;"></span>
      </p>
      <div id="dash-feed">
        <div class="feed-empty-msg">Loading...</div>
      </div>

    </div>
  </div>

</div>
</div>

<main-footer id="mainfooter-v"></main-footer>

<script>
(function () {

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  function timeAgo(d) {
    var s = Math.floor((Date.now() - new Date(d)) / 1000);
    if (s < 60)    return s + 's ago';
    if (s < 3600)  return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function fmtDate(d) {
    return new Date(d).toLocaleDateString('en-US', { day:'numeric', month:'long' });
  }

  // Site notification banner
  fetch('/api/notifications')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var b = document.getElementById('dash-banner');
        b.innerHTML = data[0].message;
        b.className = data[0].type || 'warning';
        b.style.display = 'block';
      }
    }).catch(function(){});

  // Load user + dashboard data
  fetch('/api/me', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(u) {
      if (!u || !u.id) return;

      // Avatar + name + currency
      document.getElementById('dash-avatar').src = '/api/v1/thumbnails/single?type=1&id=' + u.id;
      document.getElementById('dash-username').textContent = u.username;
      document.getElementById('dash-bucks').textContent = (u.cores || 0).toLocaleString();

      // Nav: currency + username dropdown
      var navRight = document.getElementById('nav-right');
      navRight.innerHTML =
        '<span style="color:#fff;font-size:13px;margin-right:6px;">'
        + '<span class="bits-icon"></span> ' + (u.duts||0)
        + '</span>'
        + '<span style="color:#fff;font-size:13px;margin-right:6px;">'
        + '<span class="bucks-icon"></span> ' + (u.cores||0)
        + '</span>'
        + '<span style="color:#fff;font-size:13px;margin-right:6px;">'
        + '<span class="messages-icon"></span> 0'
        + '</span>'
        + '<span style="color:#fff;font-size:13px;margin-right:6px;">'
        + '<span class="friends-icon"></span> 0'
        + '</span>'
        + '<span class="username" id="username-nav" style="color:#fff;font-size:14px;cursor:pointer;position:relative;">'
        + esc(u.username) + ' <span class="arrow-down"></span>'
        + '<div id="user-dropdown" style="display:none;position:absolute;right:0;top:28px;'
        + 'background:#1e1e24;border:1px solid #3a3a44;border-radius:5px;min-width:140px;z-index:9999;padding:4px 0;">'
        + '<a href="/user/' + u.id + '" style="display:block;padding:8px 14px;color:#ccc;font-size:13px;text-decoration:none;">Profile</a>'
        + '<a href="/settings" style="display:block;padding:8px 14px;color:#ccc;font-size:13px;text-decoration:none;">Settings</a>'
        + '<a href="/avatar" style="display:block;padding:8px 14px;color:#ccc;font-size:13px;text-decoration:none;">Avatar</a>'
        + '<hr style="border-color:#2e2e36;margin:4px 0;">'
        + '<a href="#" id="logout-btn" style="display:block;padding:8px 14px;color:#ef263d;font-size:13px;text-decoration:none;">Log Out</a>'
        + '</div></span>';

      // Profile link in secondary nav
      var pl = document.getElementById('nav-profile-link');
      if (pl) pl.href = '/user/' + u.id;

      // Show secondary nav
      document.getElementById('secondary-nav').style.display = 'block';

      // Dropdown toggle
      document.getElementById('username-nav').addEventListener('click', function(e) {
        e.stopPropagation();
        var dd = document.getElementById('user-dropdown');
        dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
      });
      document.addEventListener('click', function() {
        var dd = document.getElementById('user-dropdown');
        if (dd) dd.style.display = 'none';
      });

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async function(e) {
        e.preventDefault();
        await fetch('/api/logout', { method: 'POST' });
        if ('caches' in window) {
          caches.keys().then(function(n) { n.forEach(function(k) { caches.delete(k); }); });
        }
        window.location.replace('/');
      });

      // Load dashboard data (blog + feed + friends)
      return fetch('/api/dashboard');
    })
    .then(function(r) { return r && r.json(); })
    .then(function(data) {
      if (!data) return;

      // Blog posts
      var blog = document.getElementById('dash-blog');
      if (data.posts && data.posts.length > 0) {
        blog.innerHTML = data.posts.map(function(p) {
          var img = p.cover_url
            ? '<img class="blog-bg" src="' + esc(p.cover_url) + '" alt="">'
            : '<div class="blog-bg"></div>';
          return '<a class="blog-tile" href="https://projectsaturn-blog.vercel.app/' + esc(p.slug) + '" target="_blank">'
            + img
            + '<div class="blog-overlay">'
            + '<div class="blog-title">' + esc(p.title) + '</div>'
            + '<div class="blog-meta">' + esc(p.author_name||'Saturn') + ' · ' + fmtDate(p.created_at) + '</div>'
            + '</div></a>';
        }).join('');
      } else {
        blog.innerHTML = '';
      }

      // Friend requests badge
      if (data.friend_requests > 0) {
        var badge = document.getElementById('req-badge');
        badge.textContent = data.friend_requests + ' pending';
        badge.style.display = 'inline';
      }

      // Feed
      var feedEl = document.getElementById('dash-feed');
      if (data.feed && data.feed.length > 0) {
        feedEl.innerHTML = data.feed.map(function(item) {
          var uname = item.users ? item.users.username : 'Unknown';
          return '<div class="feed-item-row">'
            + '<img src="/api/v1/thumbnails/single?type=1&id=' + item.user_id + '" onerror="this.src=\'/cdn/images/default-avatar.png\'">'
            + '<div><span class="feed-name">' + esc(uname) + '</span>'
            + '<span class="feed-time">· ' + timeAgo(item.updated_at) + '</span>'
            + '<div class="feed-msg">' + esc(item.message) + '</div></div>'
            + '</div>';
        }).join('');
      } else {
        feedEl.innerHTML = '<div class="feed-empty-msg">Your feed is empty! Add some friends to see their updates.</div>';
      }

    }).catch(function(e) { console.error('Dashboard load error:', e); });

  // Status POST button
  document.getElementById('status-btn').addEventListener('click', async function() {
    var msg = document.getElementById('status-input').value.trim();
    if (!msg) return;
    this.disabled = true;
    this.textContent = '...';
    try {
      var res = await fetch('/api/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      if (res.ok) {
        document.getElementById('status-input').value = '';
        if (window._saturnNotify) window._saturnNotify('Status updated!', 'success');
      } else {
        var d = await res.json();
        if (window._saturnNotify) window._saturnNotify(d.error || 'Error.', 'error');
      }
    } catch(e) {
      if (window._saturnNotify) window._saturnNotify('Network error.', 'error');
    }
    this.disabled = false;
    this.textContent = 'POST';
  });

})();
</script>

</body>
