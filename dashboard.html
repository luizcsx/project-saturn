<script>
(function() {
  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }
  if (!getCookie('saturn_session')) {
    window.location.replace('/');
  }
})();
</script>

<script>
fetch('/api/me').then(r => r.json()).then(u => {
  if (!u.id) return;
  const m = document.querySelector('meta[name="user-data"]');
  m.dataset.authenticated = 'true';
  m.dataset.id = u.id;
  m.dataset.username = u.username;
  m.dataset.duts = u.duts;
  m.dataset.cores = u.cores;
  m.dataset.membership = u.membership;
});
</script>

<style>
.dashboard-wrap {
  display: flex;
  gap: 20px;
  margin-top: 16px;
}
.dashboard-left {
  width: 220px;
  flex-shrink: 0;
}
.dashboard-right {
  flex: 1;
  min-width: 0;
}

.avatar-card {
  text-align: center;
  margin-bottom: 16px;
}
.avatar-card img.player-avatar {
  width: 180px;
  height: 180px;
  object-fit: cover;
  display: block;
  margin: 0 auto 8px;
}
.avatar-card .player-name {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 2px;
}
.avatar-card .player-currency {
  font-size: 13px;
  color: #aaa;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.avatar-card .player-currency img {
  width: 16px;
  height: 16px;
}
.avatar-card .currency-arrow {
  color: #555;
  cursor: pointer;
  font-size: 10px;
}
.divider-line {
  border: none;
  border-top: 1px solid #2e2e34;
  margin: 10px 0;
}

.friends-count {
  font-size: 13px;
  font-weight: 700;
  color: #888;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.friends-count span {
  color: #fff;
  font-size: 15px;
  margin-right: 4px;
}
.friend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid #1e1e22;
}
.friend-item:last-child { border-bottom: none; }
.friend-item img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  background: #2a2a2e;
}
.friend-item .friend-info { flex: 1; min-width: 0; }
.friend-item .friend-name {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 4px;
}
.online-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #23d160;
  display: inline-block;
  flex-shrink: 0;
}
.friend-item .friend-msg-btn {
  font-size: 11px;
  font-weight: 700;
  color: #00A9FE;
  letter-spacing: .5px;
  cursor: pointer;
  text-decoration: none;
}
.friend-item .friend-msg-btn:hover { text-decoration: underline; }

.blog-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}
.blog-card {
  position: relative;
  border-radius: 5px;
  overflow: hidden;
  min-height: 110px;
  background: #1e1e24;
  display: block;
  text-decoration: none;
  cursor: pointer;
}
.blog-card .blog-img {
  width: 100%;
  height: 110px;
  object-fit: cover;
  display: block;
}
.blog-card .blog-placeholder {
  width: 100%; height: 110px;
  background: linear-gradient(135deg, #1a1a2e, #0f3460);
}
.blog-card .blog-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  padding: 22px 8px 7px;
  color: #fff;
}
.blog-card .blog-title {
  font-size: 12px;
  font-weight: 700;
  margin: 0 0 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.blog-card .blog-meta {
  font-size: 10px;
  opacity: .75;
}

.site-notif-banner {
  width: 100%;
  background: #ef9526;
  color: #fff;
  text-align: center;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 4px;
  margin-bottom: 14px;
  box-sizing: border-box;
  display: none;
}
.site-notif-banner a { color: #fff; text-decoration: underline; }
.site-notif-banner.success { background: #23d160; }
.site-notif-banner.error   { background: #ef263d; }
.site-notif-banner.info    { background: #7b52ab; }

.section-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.req-badge {
  background: #ef263d;
  color: #fff;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
}

.status-box {
  border: 1px solid #3a3a44;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 18px;
  background: #1a1a20;
}
.status-box textarea {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #ccc;
  font-size: 14px;
  padding: 12px 14px;
  resize: none;
  box-sizing: border-box;
  font-family: inherit;
  min-height: 72px;
}
.status-box textarea::placeholder { color: #555; }
.status-submit-wrap { padding: 0 12px 10px; }
.status-submit {
  background: #00A9FE;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 7px 22px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
}
.status-submit:hover { background: #0090d8; }

.feed-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #1e1e24;
}
.feed-item:last-child { border-bottom: none; }
.feed-item img {
  width: 38px; height: 38px;
  border-radius: 50%;
  object-fit: cover;
  background: #2a2a2e;
  flex-shrink: 0;
}
.feed-content { flex: 1; }
.feed-name { font-weight: 700; color: #fff; font-size: 14px; }
.feed-time { font-size: 12px; color: #666; margin-left: 5px; }
.feed-msg  { color: #bbb; font-size: 13px; margin-top: 2px; word-break: break-word; }
.feed-empty { color: #555; font-size: 13px; padding: 16px 0; text-align: center; }

.guest-prompt {
  text-align: center;
  padding: 30px 0;
  color: #666;
}
.guest-prompt p { font-size: 15px; margin-bottom: 12px; }

<script>
(function () {

  function timeAgo(d) {
    var s = Math.floor((Date.now() - new Date(d)) / 1000);
    if (s < 60)    return s + 's ago';
    if (s < 3600)  return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function fmtDate(d) {
    return new Date(d).toLocaleDateString('en-US', { day: 'numeric', month: 'long' });
  }

  function avatarUrl(id) {
    return '/api/v1/thumbnails/single?type=1&id=' + id;
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  fetch('/api/notifications')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var b = document.getElementById('site-banner');
        b.innerHTML = data[0].message;
        b.className = 'site-notif-banner ' + (data[0].type || 'warning');
        b.style.display = 'block';
      }
    }).catch(function(){});

  fetch('/api/dashboard')
    .then(function(r) { return r.json(); })
    .then(function(data) {

      var grid = document.getElementById('blog-grid');
      if (data.posts && data.posts.length > 0) {
        grid.innerHTML = data.posts.map(function(p) {
          var img = p.cover_url
            ? '<img class="blog-img" src="' + esc(p.cover_url) + '" alt="">'
            : '<div class="blog-placeholder"></div>';
          return '<a class="blog-card" href="https://projectsaturn-blog.vercel.app/' + esc(p.slug) + '" target="_blank">'
            + img
            + '<div class="blog-overlay">'
            + '<div class="blog-title">' + esc(p.title) + '</div>'
            + '<div class="blog-meta">' + esc(p.author_name || 'Saturn') + ' · ' + fmtDate(p.created_at) + '</div>'
            + '</div></a>';
        }).join('');
      } else {
        grid.innerHTML = '<p style="color:#555; font-size:13px; grid-column:span 3;">No blog posts yet.</p>';
      }

      if (data.authenticated) {
        document.getElementById('dashboard-guest').style.display = 'none';
        document.getElementById('dashboard-auth').style.display = 'block';
        document.getElementById('dashboard-left').style.display = 'block';
        document.getElementById('dashboard-left-guest').style.display = 'none';

        if (data.friend_requests > 0) {
          var badge = document.getElementById('req-badge');
          badge.textContent = data.friend_requests + ' pending';
          badge.style.display = 'inline-block';
        }

        var feedEl = document.getElementById('feed-list');
        if (data.feed && data.feed.length > 0) {
          feedEl.innerHTML = data.feed.map(function(item) {
            var uname = item.users ? item.users.username : 'Unknown';
            var uid   = item.user_id;
            return '<div class="feed-item">'
              + '<img src="' + avatarUrl(uid) + '" onerror="this.src=\'cdn/images/default-avatar.png\'">'
              + '<div class="feed-content">'
              + '<span class="feed-name">' + esc(uname) + '</span>'
              + '<span class="feed-time">· ' + timeAgo(item.updated_at) + '</span>'
              + '<div class="feed-msg">' + esc(item.message) + '</div>'
              + '</div></div>';
          }).join('');
        } else {
          feedEl.innerHTML = '<div class="feed-empty">Nothing here yet. Add some friends to see their updates!</div>';
        }

      } else {
        document.getElementById('dashboard-auth').style.display = 'none';
        document.getElementById('dashboard-guest').style.display = 'block';
        document.getElementById('dashboard-left').style.display = 'none';
        document.getElementById('dashboard-left-guest').style.display = 'block';
      }

    }).catch(function() {
      document.getElementById('dashboard-guest').style.display = 'block';
      document.getElementById('dashboard-left-guest').style.display = 'block';
    });

  fetch('/api/me').then(function(r) { return r.json(); }).then(function(u) {
    if (!u.id) return;
    document.getElementById('player-avatar').src = avatarUrl(u.id);
    document.getElementById('player-name').textContent = u.username;
    document.getElementById('player-duts').textContent = (u.duts || u.bits || 0).toLocaleString();
    document.getElementById('player-cores').textContent = (u.cores || u.bucks || 0).toLocaleString();

    document.getElementById('friend-count').textContent = '0';
    document.getElementById('friends-list').innerHTML =
      '<div class="feed-empty" style="font-size:12px;">Friends coming soon.</div>';
  });

  document.getElementById('status-btn').addEventListener('click', async function() {
    var msg = document.getElementById('status-input').value.trim();
    if (!msg) return;

    this.disabled = true;
    this.textContent = 'Posting...';

    try {
      var res = await fetch('/api/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      if (res.ok) {
        document.getElementById('status-input').value = '';
        if (window._saturnNotify) window._saturnNotify('Status updated!', 'success');
      } else {
        var d = await res.json();
        if (window._saturnNotify) window._saturnNotify(d.error || 'Failed to update status.', 'error');
      }
    } catch(e) {
      if (window._saturnNotify) window._saturnNotify('Network error.', 'error');
    }

    this.disabled = false;
    this.textContent = 'SUBMIT';
  });

})();
</script>


<script>
(function() {
  fetch('/api/me').then(function(r) { return r.json(); }).then(function(u) {
    if (!u || !u.id) {
      window.location.replace('/');
      return;
    }
    var area = document.getElementById('nav-auth-area');
    if (area) {
      area.innerHTML =
        '<span style="color:#fff;font-size:14px;cursor:pointer;" id="username-nav">'
        + u.username
        + ' <span style="font-size:10px;opacity:.6;">▼</span>'
        + '</span>'
        + '<div id="logout-menu" style="display:none;position:absolute;right:0;top:30px;'
        + 'background:#1e1e24;border:1px solid #3a3a44;border-radius:5px;min-width:140px;z-index:9999;padding:4px 0;">'
        + '<a href="user/' + u.id + '.html" style="display:block;padding:8px 14px;color:#ccc;font-size:13px;text-decoration:none;">Profile</a>'
        + '<a href="/settings" style="display:block;padding:8px 14px;color:#ccc;font-size:13px;text-decoration:none;">Settings</a>'
        + '<hr style="border-color:#2e2e36;margin:4px 0;">'
        + '<a href="#" id="logout-btn" style="display:block;padding:8px 14px;color:#ef263d;font-size:13px;text-decoration:none;">Log Out</a>'
        + '</div>';

      document.getElementById('username-nav').addEventListener('click', function(e) {
        e.stopPropagation();
        var menu = document.getElementById('logout-menu');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      });

      document.addEventListener('click', function() {
        var menu = document.getElementById('logout-menu');
        if (menu) menu.style.display = 'none';
      });

      document.getElementById('logout-btn').addEventListener('click', async function(e) {
        e.preventDefault();
        await fetch('/api/logout', { method: 'POST' });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        window.location.replace('/');
      });
    }
  });
})();
</script>
